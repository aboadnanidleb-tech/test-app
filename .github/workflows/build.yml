name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      env:
        ALLOW_ROOT: 1
        BUILDOZER_AUTO_ACCEPT_LICENSES: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: bin/*.apk
