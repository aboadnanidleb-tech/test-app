name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ALLOW_ROOT: 1
      BUILDOZER_ALLOW_ROOT: 1
      BUILDOZER_AUTO_ACCEPT_LICENSES: 1
    
    container:
      image: kivy/buildozer:latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: bin/*.apk
